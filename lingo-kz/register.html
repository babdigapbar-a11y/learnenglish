<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тіркелу — Bimbox</title>
    <meta name="description" content="Bimbox-ке тіркелу" />
    <meta name="theme-color" content="#7C3AED" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script>try{var th=localStorage.getItem("lingo-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" /></noscript>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="modulepreload" href="js/ui.js" />
    <link rel="modulepreload" href="js/i18n-kk.js" />
    <link rel="modulepreload" href="js/firebase-config.js" />
    <link rel="modulepreload" href="js/auth.js" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
  </head>
  <body data-page="auth">
    <div class="app-shell">
      <div class="page-card">
        <div class="auth-layout">
          <aside class="auth-side mascot-stage">
            <!-- МАСКОТ: поменяйте src на путь к своему файлу -->
            <img class="mascot lg" src="assets/mascot.png" alt="Bimbox" width="220" height="220" decoding="async" />
            <h2>Bimbox</h2>
            <p>Ағылшын тілін ойын арқылы үйреніңіз</p>
          </aside>
          <div class="auth-main">
        <div class="auth-head">
          <h1>Тіркелу</h1>
          <p>Бірнеше секундта бастаңыз</p>
        </div>
        <form id="form" novalidate>
          <div class="field">
            <label for="name">Аты-жөні</label>
            <input id="name" type="text" maxlength="40" placeholder="Айгерім Нұрланқызы" required />
            <div class="field-error" id="name-err"></div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="at@example.com" required />
            <div class="field-error" id="email-err"></div>
          </div>
          <div class="field">
            <label for="password">Құпия сөз</label>
            <div class="password-wrap">
              <input id="password" type="password" autocomplete="new-password" placeholder="Кемінде 6 таңба" required />
              <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Құпия сөзді көрсету">👁</button>
            </div>
            <div class="field-error" id="password-err"></div>
          </div>
          <div class="field">
            <label for="password2">Құпия сөзді қайталау</label>
            <div class="password-wrap">
              <input id="password2" type="password" autocomplete="new-password" placeholder="Құпия сөзді қайталаңыз" required />
              <button class="password-toggle" type="button" data-password-toggle="password2" aria-label="Құпия сөзді көрсету">👁</button>
            </div>
            <div class="field-error" id="password2-err"></div>
          </div>
          <button class="btn btn-block" id="submit" type="submit">Тіркелу</button>
        </form>
        <p style="text-align: center; margin-top: 16px">Аккаунт бар ма? <a href="login.html">Кіру</a></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { initChrome, toast, setButtonLoading, wirePasswordToggles } from "./js/ui.js";
      import { t, firebaseErrorKk } from "./js/i18n-kk.js";
      import { guardPage, registerWithEmail } from "./js/auth.js";

      initChrome();
      wirePasswordToggles();
      await guardPage({ guestOnly: true });
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;
        ["name-err", "email-err", "password-err", "password2-err"].forEach((id) => {
          document.getElementById(id).textContent = "";
        });
        let bad = false;
        if (name.length < 1 || name.length > 40) {
          document.getElementById("name-err").textContent = t.required;
          bad = true;
        }
        if (!emailRe.test(email)) {
          document.getElementById("email-err").textContent = t.invalidEmail;
          bad = true;
        }
        if (password.length < 6) {
          document.getElementById("password-err").textContent = t.weakClient;
          bad = true;
        }
        if (password !== password2) {
          document.getElementById("password2-err").textContent = t.passwordsMismatch;
          bad = true;
        }
        if (bad) return;
        const btn = document.getElementById("submit");
        setButtonLoading(btn, true);
        try {
          await registerWithEmail(name, email, password);
          /* новый аккаунт → сначала онбординг-квиз */
          location.href = "onboarding.html";
        } catch (err) {
          toast(firebaseErrorKk(err), "err");
        } finally {
          setButtonLoading(btn, false);
        }
      });

          </script>
  </body>
</html>
