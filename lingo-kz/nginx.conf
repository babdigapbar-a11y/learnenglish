server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # HTML всегда перепроверяется — новые версии видны сразу
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # CSS/JS: час свежести + фоновое обновление (файлы без хеша в имени)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # картинки/шрифты меняются редко
    location ~* \.(svg|png|jpg|jpeg|webp|avif|gif|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
